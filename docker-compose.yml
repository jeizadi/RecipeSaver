services:
  postgres:
    image: postgres:16-alpine
    container_name: recipesaver-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recipesaver
      POSTGRES_USER: recipesaver
      POSTGRES_PASSWORD: recipesaver
    ports:
      - "5433:5432"
    volumes:
      - recipesaver-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipesaver -d recipesaver"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recipesaver-postgres-data:
